name: Agent Skills smoke validation

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'scripts/install-skills.mjs'
      - 'tests/**'
      - '.github/workflows/skills-smoke.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'scripts/install-skills.mjs'
      - 'tests/**'
      - '.github/workflows/skills-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Skill structure, gates and isolated installs
        run: node --test tests/skills-contract.test.mjs
